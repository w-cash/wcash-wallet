name: wcash_warden
description: Wcash Warden Testnet receive wallet.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_rust_bridge: 2.11.1
  flutter_secure_storage: 10.0.0
  go_router: ^17.1.0
  path: 1.9.1
  path_provider: 2.1.5
  pretty_qr_code: ^3.6.0
  rust_lib_wcash_warden:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  flutter_secure_storage_linux:
    path: vendor/flutter_secure_storage_linux
  flutter_secure_storage_windows:
    path: vendor/flutter_secure_storage_windows

flutter:
  uses-material-design: true
